<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFB-ICV-2026 · Instituto Ben — Relatório de Tráfego Pago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--roxo:#7C3AED;--roxo-soft:#A78BFA;--verde:#059669;--vermelho:#DC2626;--amarelo:#D97706;--cinza:#6B7280;--borda:#E7E3EE;--bg-soft:#FAF9FC;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',sans-serif;font-weight:300;background:#fff;color:#1F1135;}
a{color:var(--roxo);text-decoration:none;}
a:hover{text-decoration:underline;}

.hero{background:linear-gradient(150deg,#0A0A0A 0%,#17111F 45%,#3B0F73 100%);position:relative;overflow:hidden;padding:56px 24px 40px;text-align:center;color:#fff;}
.hero::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(transparent,transparent 43px,rgba(124,58,237,.18) 43px,rgba(124,58,237,.18) 44px),repeating-linear-gradient(90deg,transparent,transparent 43px,rgba(124,58,237,.18) 43px,rgba(124,58,237,.18) 44px);pointer-events:none;}
.hero::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 40%,rgba(124,58,237,.55) 0%,transparent 70%);pointer-events:none;}
.hero-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto;}
.logo-bm{width:52px;height:52px;margin-bottom:16px;}
.hero h1{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.hero .sub{font-size:.95rem;opacity:.75;margin-bottom:4px;}
.hero .ts{font-size:.8rem;opacity:.55;margin-bottom:24px;}
.hero-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:900px;margin:0 auto;}
.hero-kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 14px;}
.hero-kpi .label{font-size:.7rem;opacity:.6;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.hero-kpi .val{font-size:1.5rem;font-weight:800;line-height:1.1;}
.hero-kpi .sub2{font-size:.72rem;opacity:.55;margin-top:4px;}

.periodo-filtro{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1.5px solid var(--borda);padding:12px 20px 4px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.campanha-filtro{position:sticky;top:51px;z-index:9;background:#fff;padding:4px 20px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.serie-filtro{position:sticky;top:88px;z-index:8;background:#fff;border-bottom:1.5px solid var(--borda);padding:4px 20px 12px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;}
.periodo-btn{font-family:'Poppins',sans-serif;font-size:.78rem;font-weight:600;color:var(--cinza);background:#fff;border:1.5px solid var(--borda);border-radius:20px;padding:7px 16px;cursor:pointer;transition:.15s;}
.periodo-btn:hover{border-color:var(--roxo-soft);color:var(--roxo);}
.periodo-btn.active{background:var(--roxo);border-color:var(--roxo);color:#fff;}
.campanha-btn{font-family:'Poppins',sans-serif;font-size:.72rem;font-weight:600;color:var(--roxo-soft);background:#F5F3FF;border:1.5px solid transparent;border-radius:20px;padding:5px 14px;cursor:pointer;transition:.15s;}
.campanha-btn:hover{border-color:var(--roxo-soft);}
.campanha-btn.active{background:var(--roxo-soft);border-color:var(--roxo-soft);color:#fff;}
.serie-label{font-size:.68rem;color:var(--cinza);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-right:4px;}
.serie-btn{font-family:'Poppins',sans-serif;font-size:.7rem;font-weight:600;color:#1F1135;background:#fff;border:1.5px dashed var(--borda);border-radius:8px;padding:4px 12px;cursor:pointer;transition:.15s;}
.serie-btn:hover{border-color:var(--roxo);}
.serie-btn.active{background:#1F1135;border-color:#1F1135;border-style:solid;color:#fff;}
.filtro-nota{font-size:.72rem;color:var(--cinza);text-align:center;margin-bottom:14px;font-style:italic;}

.container{max-width:1100px;margin:0 auto;padding:0 20px;}
section{padding:48px 20px;}
section.bg{background:#fff;}
section.bg-soft{background:var(--bg-soft);}
.section-title{font-size:1.2rem;font-weight:700;color:var(--roxo);margin-bottom:22px;display:flex;align-items:center;gap:8px;}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:16px;}
.kpi-card{background:#fff;border:1.5px solid var(--borda);border-radius:14px;padding:18px 16px;}
.kpi-card .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.5px;color:var(--roxo);font-weight:600;margin-bottom:6px;}
.kpi-card .val{font-size:1.4rem;font-weight:800;color:#1F1135;line-height:1.1;}
.kpi-card .sub{font-size:.72rem;color:var(--cinza);margin-top:4px;}
.kpi-card.neg .val{color:var(--vermelho);}
.kpi-card.pos .val{color:var(--verde);}
.kpi-card.warn .val{color:var(--amarelo);}

.funnel-wrap{display:grid;grid-template-columns:1fr;gap:24px;}
.funnel-box{background:#fff;border:1.5px solid var(--borda);border-radius:16px;padding:24px 20px;}
.funnel-box h3{font-size:.95rem;font-weight:700;color:var(--roxo);margin-bottom:18px;text-align:center;}
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.funnel-bar{height:34px;border-radius:8px;background:linear-gradient(90deg,rgba(124,58,237,.15),rgba(124,58,237,.07));border:1px solid rgba(124,58,237,.2);display:flex;align-items:center;padding:0 12px;font-size:.76rem;font-weight:600;color:#1F1135;white-space:nowrap;overflow:hidden;}
.funnel-meta{min-width:80px;text-align:right;font-size:.73rem;color:var(--cinza);}

.table-wrap{overflow-x:auto;border-radius:16px;border:1.5px solid var(--borda);}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
thead tr{background:var(--bg-soft);}
th{padding:12px 14px;text-align:left;font-weight:700;color:var(--roxo);font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:1.5px solid var(--borda);}
td{padding:11px 14px;border-bottom:1px solid var(--borda);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(124,58,237,.03);}
.bold{font-weight:700;}
.muted{color:var(--cinza);font-size:.75rem;}
.neg-txt{color:var(--vermelho);}
.pos-txt{color:var(--verde);}
.warn-txt{color:var(--amarelo);}
th.right,td.right{text-align:right;}

footer{background:#141018;color:rgba(255,255,255,.5);padding:36px 20px;text-align:center;font-size:.78rem;}
footer .logo-f{color:#A78BFA;font-weight:800;font-size:1rem;margin-bottom:8px;}
footer p{margin-bottom:4px;}

.state{text-align:center;padding:80px 20px;color:var(--cinza);font-size:.9rem;}
.state.error{color:var(--vermelho);}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <svg class="logo-bm" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="26,2 48,14 48,38 26,50 4,38 4,14" fill="none" stroke="white" stroke-width="2"/>
      <polygon points="26,10 40,18 40,34 26,42 12,34 12,18" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.2"/>
      <text x="26" y="31" text-anchor="middle" font-family="Poppins,sans-serif" font-size="13" font-weight="800" fill="white">BM</text>
    </svg>
    <h1>Imersão Clínica de Valor</h1>
    <div class="sub">Instituto Ben · IFB-ICV-2026 · Tráfego Pago</div>
    <div class="ts" id="periodo">Carregando período…</div>
    <div class="hero-kpis" id="hero-kpis"></div>
  </div>
</div>

<div class="periodo-filtro" id="filtro"></div>
<div class="campanha-filtro" id="filtro-campanha"></div>
<div class="serie-filtro" id="filtro-serie"></div>

<main id="app">
  <div class="state" id="loading">Carregando dados do Supabase…</div>
</main>

<footer>
  <div class="logo-f">Brito Mídias</div>
  <p>Imersão Clínica de Valor · Instituto Ben</p>
  <p>Dashboard vivo — lê direto do Supabase, atualiza sozinho a cada 3h</p>
</footer>

<script>
const SUPABASE_URL = 'https://bsexxjbiqedkdgtkeyys.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzZXh4amJpcWVka2RndGtleXlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzc0NzgsImV4cCI6MjEwMjc1MzQ3OH0.SAVK1fYrjPFWf8NfrqKLdBvDP732OrOwU5l9gQhu4b4';

const PERIODOS = [
  { key: 'total', label: 'Total', dias: null },
  { key: '60', label: '60 dias', dias: 60 },
  { key: '30', label: '30 dias', dias: 30 },
  { key: '15', label: '15 dias', dias: 15 },
  { key: '7', label: '7 dias', dias: 7 },
  { key: '3', label: '3 dias', dias: 3 },
];
let periodoAtivo = '30';
let campanhaAtiva = 'todas';
let serieAtiva = 'todas';
let DADOS = null;

function classificarIntencao(campaignName) {
  const n = (campaignName || '').toUpperCase();
  if (n.includes('REMARKETING') || n.includes('RETARGETING')) return 'Remarketing';
  if (n.includes('LOOKALIKE') || n.includes('LK1%') || n.includes('COMPRADORES')) return 'Lookalike';
  if (n.includes('P-ADVANTAGE') || n.includes('ADVANTAGE')) return 'Prospecção (Advantage+)';
  if (n.includes('QUENTE')) return 'Público Quente';
  if (n.includes('FRIO')) return 'Público Frio';
  return 'Outro';
}

// Extrai a SÉRIE da campanha — o 2º colchete do nome (ex.: "[01] [IFB-ICV-2026]
// [CAPTACAO PAGA]..." → "IFB-ICV-2026"). Hoje só existe 1 valor pra esse
// cliente, mas fica pronto pro dia que rodar mais de um produto/série.
function extrairSerie(campaignName) {
  const m = (campaignName || '').match(/^\s*\[[^\]]*\]\s*\[([^\]]*)\]/);
  return m ? m[1].trim() : 'Sem série identificada';
}

async function fetchView(name) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${name}?select=*`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if (!res.ok) throw new Error(`${name}: ${res.status} ${await res.text()}`);
  return res.json();
}

const fmtMoney = (v) => v === null || v === undefined || !isFinite(v) ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const fmtNum = (v) => v === null || v === undefined || !isFinite(v) ? '—' : Number(v).toLocaleString('pt-BR');
const fmtPct = (v) => v === null || v === undefined || !isFinite(v) ? '—' : `${(Number(v) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 })}%`;
const fmtPctDirect = (v) => v === null || v === undefined || !isFinite(v) ? '—' : `${Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
const fmtDate = (v) => new Date(v).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const posNeg = (v) => Number(v) < 0 ? 'neg' : 'pos';
const posNegTxt = (v) => Number(v) < 0 ? 'neg-txt' : 'pos-txt';
const dayKey = (v) => new Date(v).toISOString().slice(0, 10);

function heroKpi(label, val, sub) {
  return `<div class="hero-kpi"><div class="label">${label}</div><div class="val">${val}</div>${sub ? `<div class="sub2">${sub}</div>` : ''}</div>`;
}
function kpiCard(label, val, variant, sub) {
  return `<div class="kpi-card${variant ? ' ' + variant : ''}"><div class="label">${label}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}
function funnelRow(width, label, meta) {
  return `<div class="funnel-row"><div class="funnel-bar" style="width:${width}%">${label}</div>${meta ? `<div class="funnel-meta">${meta}</div>` : ''}</div>`;
}

function filtrarPeriodo(diasCount) {
  const todosDias = DADOS.dias.map((d) => d.dia).filter(Boolean).sort();
  const ultimoDia = todosDias[todosDias.length - 1];
  let corte = null;
  if (diasCount !== null && ultimoDia) {
    const d = new Date(ultimoDia + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() - (diasCount - 1));
    corte = d.toISOString().slice(0, 10);
  }
  const dentro = (dia) => corte === null || dayKey(dia) >= corte;
  return {
    dias: DADOS.dias.filter((d) => d.dia && dentro(d.dia)),
    pagamento: DADOS.pagamento.filter((d) => d.dia && dentro(d.dia)),
    produto: DADOS.produto.filter((d) => d.dia && dentro(d.dia)),
    campanhas: DADOS.campanhas.filter((d) => d.dia && dentro(d.dia)),
    ultimoDia,
  };
}

function agregar(filtrado) {
  const dias = filtrado.dias;
  const s = (key) => dias.reduce((acc, d) => acc + (Number(d[key]) || 0), 0);

  const investimento_bruto = s('investimento_bruto');
  const invest_c_imposto = Math.round(investimento_bruto * 1.1383 * 100) / 100;
  const receita_total = s('receita_total');
  const vendas_ingresso = s('vendas_ingresso');
  const impressions = s('impressions');
  const clicks = s('clicks');
  const page_views = s('page_views');
  const checkouts = s('checkouts');
  const purchases_pixel = s('purchases_pixel');
  const exposicao = receita_total - invest_c_imposto;

  const pagamento = {};
  for (const row of filtrado.pagamento) {
    const k = row.payment_type || 'Outro';
    if (!pagamento[k]) pagamento[k] = { payment_type: k, qtd: 0, receita: 0 };
    pagamento[k].qtd += Number(row.qtd) || 0;
    pagamento[k].receita += Number(row.receita) || 0;
  }
  const pagTotalQtd = Object.values(pagamento).reduce((a, x) => a + x.qtd, 0);
  const pagTotalReceita = Object.values(pagamento).reduce((a, x) => a + x.receita, 0);
  const pagamentoList = Object.values(pagamento).map((x) => ({
    ...x, pct_pedidos: 100 * x.qtd / pagTotalQtd, pct_receita: 100 * x.receita / pagTotalReceita,
  })).sort((a, b) => b.receita - a.receita);

  const produto = filtrado.produto.reduce((acc, d) => ({
    qtd_ingresso: acc.qtd_ingresso + (Number(d.qtd_ingresso) || 0),
    qtd_bump_mapa_clinico: acc.qtd_bump_mapa_clinico + (Number(d.qtd_bump_mapa_clinico) || 0),
    qtd_bump_gravacao: acc.qtd_bump_gravacao + (Number(d.qtd_bump_gravacao) || 0),
    qtd_bump_segunda_cadeira: acc.qtd_bump_segunda_cadeira + (Number(d.qtd_bump_segunda_cadeira) || 0),
    qtd_bump_pilares: acc.qtd_bump_pilares + (Number(d.qtd_bump_pilares) || 0),
  }), { qtd_ingresso: 0, qtd_bump_mapa_clinico: 0, qtd_bump_gravacao: 0, qtd_bump_segunda_cadeira: 0, qtd_bump_pilares: 0 });

  return {
    dias: [...dias].sort((a, b) => new Date(b.dia) - new Date(a.dia)),
    resumo: {
      investimento_bruto, invest_c_imposto, receita_total, exposicao,
      exposicao_pct: exposicao / invest_c_imposto,
      roas: Math.round((receita_total / invest_c_imposto) * 100) / 100,
      ticket_medio: receita_total / vendas_ingresso,
      cpa_real: invest_c_imposto / vendas_ingresso,
      cpa_pixel: invest_c_imposto / purchases_pixel,
      cpm: 1000 * investimento_bruto / impressions,
      ctr: clicks / impressions,
      connect_rate: page_views / clicks,
      conv_checkout_venda: purchases_pixel / checkouts,
      vendas_ingresso, impressions,
    },
    pagamento: pagamentoList,
    produto,
  };
}

function agregarMidia(campanhasFiltradas, intent, serie) {
  let linhas = campanhasFiltradas;
  if (intent !== 'todas') linhas = linhas.filter((c) => classificarIntencao(c.campaign_name) === intent);
  if (serie !== 'todas') linhas = linhas.filter((c) => extrairSerie(c.campaign_name) === serie);
  const s = (key) => linhas.reduce((acc, d) => acc + (Number(d[key]) || 0), 0);
  const investimento = s('investimento');
  const invest_c_imposto = Math.round(investimento * 1.1383 * 100) / 100;
  const impressions = s('impressions');
  const link_clicks = s('link_clicks');
  const page_views = s('page_views');
  const checkouts_initiated = s('checkouts_initiated');
  const purchases_pixel = s('purchases_pixel');
  return {
    investimento, invest_c_imposto, impressions, link_clicks, page_views, checkouts_initiated, purchases_pixel,
    cpm: 1000 * investimento / impressions,
    ctr: link_clicks / impressions,
    connect_rate: page_views / link_clicks,
    conv_checkout_venda: purchases_pixel / checkouts_initiated,
    cpa_pixel: invest_c_imposto / purchases_pixel,
  };
}

function renderFiltro() {
  document.getElementById('filtro').innerHTML = PERIODOS.map((p) =>
    `<button class="periodo-btn${p.key === periodoAtivo ? ' active' : ''}" data-key="${p.key}">${p.label}</button>`
  ).join('');
  document.querySelectorAll('.periodo-btn').forEach((btn) => {
    btn.addEventListener('click', () => { periodoAtivo = btn.dataset.key; renderFiltro(); renderTudo(); });
  });

  const intents = ['todas', ...new Set(DADOS.campanhas.map((c) => classificarIntencao(c.campaign_name)))];
  document.getElementById('filtro-campanha').innerHTML = intents.map((i) =>
    `<button class="campanha-btn${i === campanhaAtiva ? ' active' : ''}" data-key="${i}">${i === 'todas' ? '🎯 Todas as campanhas' : i}</button>`
  ).join('');
  document.querySelectorAll('.campanha-btn').forEach((btn) => {
    btn.addEventListener('click', () => { campanhaAtiva = btn.dataset.key; renderFiltro(); renderTudo(); });
  });

  const series = ['todas', ...new Set(DADOS.campanhas.map((c) => extrairSerie(c.campaign_name)))];
  document.getElementById('filtro-serie').innerHTML =
    `<span class="serie-label">Série</span>` +
    series.map((sv) =>
      `<button class="serie-btn${sv === serieAtiva ? ' active' : ''}" data-key="${sv}">${sv === 'todas' ? 'Todas' : sv}</button>`
    ).join('');
  document.querySelectorAll('.serie-btn').forEach((btn) => {
    btn.addEventListener('click', () => { serieAtiva = btn.dataset.key; renderFiltro(); renderTudo(); });
  });
}

function renderTudo() {
  const periodo = PERIODOS.find((p) => p.key === periodoAtivo);
  const filtrado = filtrarPeriodo(periodo.dias);
  const { dias, resumo: r, pagamento, produto: p } = agregar(filtrado);
  const m = agregarMidia(filtrado.campanhas, campanhaAtiva, serieAtiva);

  if (dias.length) {
    document.getElementById('periodo').textContent =
      `Período: ${fmtDate(dias[dias.length - 1].dia)} – ${fmtDate(dias[0].dia)} (${periodo.label.toLowerCase()}) · Atualiza sozinho a cada 3h`;
  } else {
    document.getElementById('periodo').textContent = 'Sem dados no período selecionado.';
  }

  document.getElementById('hero-kpis').innerHTML = [
    heroKpi('Invest. c/imp', fmtMoney(r.invest_c_imposto), `bruto ${fmtMoney(r.investimento_bruto)}`),
    heroKpi('Receita', fmtMoney(r.receita_total)),
    heroKpi('Exposição', `<span style="color:${r.exposicao < 0 ? '#F87171' : '#4ADE80'}">${fmtMoney(r.exposicao)}</span>`, fmtPct(r.exposicao_pct)),
    heroKpi('Vendas (ingresso)', fmtNum(r.vendas_ingresso)),
    heroKpi('ROAS', `<span style="color:#A78BFA">${fmtNum(r.roas)}×</span>`),
  ].join('');

  const visaoGeral = `
    <section class="bg"><div class="container">
      <div class="section-title">📊 Visão Geral — ${periodo.label}</div>
      <div class="kpi-grid">
        ${kpiCard('Investimento', fmtMoney(r.investimento_bruto))}
        ${kpiCard('Invest. c/ imposto', fmtMoney(r.invest_c_imposto), null, '× 1,1383 (taxa Meta)')}
        ${kpiCard('Receita', fmtMoney(r.receita_total))}
        ${kpiCard('Exposição', fmtMoney(r.exposicao), posNeg(r.exposicao), fmtPct(r.exposicao_pct))}
        ${kpiCard('ROAS', `${fmtNum(r.roas)}×`, r.roas >= 1 ? 'pos' : 'warn')}
        ${kpiCard('Ticket médio', fmtMoney(r.ticket_medio))}
        ${kpiCard('CPA real', fmtMoney(r.cpa_real))}
        ${kpiCard('CPA pixel Meta', fmtMoney(r.cpa_pixel))}
      </div>
    </div></section>`;

  const campanhaLabelPartes = [];
  if (campanhaAtiva !== 'todas') campanhaLabelPartes.push(campanhaAtiva.toLowerCase());
  if (serieAtiva !== 'todas') campanhaLabelPartes.push(`série ${serieAtiva}`);
  const campanhaLabel = campanhaLabelPartes.length ? campanhaLabelPartes.join(' · ') : 'todas as campanhas';
  const funil = `
    <section class="bg-soft"><div class="container">
      <div class="section-title">🔽 Funil &amp; Métricas de Mídia</div>
      <div class="kpi-grid">
        ${kpiCard('Investimento', fmtMoney(m.investimento), null, campanhaAtiva !== 'todas' ? campanhaAtiva : null)}
        ${kpiCard('Impressões', fmtNum(m.impressions))}
        ${kpiCard('CPA pixel Meta', fmtMoney(m.cpa_pixel))}
      </div>
      <div class="funnel-wrap"><div class="funnel-box">
        <h3>Da impressão à venda — ${periodo.label.toLowerCase()}, ${campanhaLabel}</h3>
        ${funnelRow(100, `👁 Impressões`, `CPM ${fmtMoney(m.cpm)}`)}
        ${funnelRow(70, `🖱 CTR (link): ${fmtPct(m.ctr)}`)}
        ${funnelRow(55, `🔗 Connect Rate: ${fmtPct(m.connect_rate)}`)}
        ${funnelRow(35, `💳 Conv. Checkout → Venda (pixel): ${fmtPct(m.conv_checkout_venda)}`)}
      </div></div>
      <p class="filtro-nota" style="margin-top:14px;">⚠️ O filtro de campanha muda só Investimento e Funil — Receita, Vendas e ROAS continuam sempre do total, porque a Hotmart não informa qual campanha gerou cada venda.</p>
    </div></section>`;

  const pagamentoRows = pagamento.map((x) => `<tr>
      <td>${x.payment_type}</td>
      <td class="right">${fmtNum(x.qtd)}</td>
      <td class="right">${fmtPctDirect(x.pct_pedidos)}</td>
      <td class="right bold">${fmtMoney(x.receita)}</td>
      <td class="right">${fmtPctDirect(x.pct_receita)}</td>
    </tr>`).join('');

  const formasPagamento = `
    <section class="bg"><div class="container">
      <div class="section-title">💳 Formas de Pagamento</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Forma</th><th class="right">Pedidos</th><th class="right">% Pedidos</th><th class="right">Receita</th><th class="right">% Receita</th></tr></thead>
        <tbody>${pagamentoRows || '<tr><td colspan="5" class="muted">Sem dados no período.</td></tr>'}</tbody>
      </table></div>
    </div></section>`;

  const vendasPorProduto = `
    <section class="bg-soft"><div class="container">
      <div class="section-title">🛒 Vendas por Produto</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Produto</th><th class="right">Vendas</th><th class="right">Taxa de anexação</th></tr></thead>
        <tbody>
          <tr><td class="bold">🏆 Imersão Clínica de Valor (ingresso)</td><td class="right bold">${fmtNum(p.qtd_ingresso)}</td><td class="right">—</td></tr>
          <tr><td>Mapa Clínico</td><td class="right">${fmtNum(p.qtd_bump_mapa_clinico)}</td><td class="right">${fmtPctDirect(100 * p.qtd_bump_mapa_clinico / p.qtd_ingresso)}</td></tr>
          <tr><td>Gravação Vitalícia</td><td class="right">${fmtNum(p.qtd_bump_gravacao)}</td><td class="right">${fmtPctDirect(100 * p.qtd_bump_gravacao / p.qtd_ingresso)}</td></tr>
          <tr><td>Segunda Cadeira</td><td class="right">${fmtNum(p.qtd_bump_segunda_cadeira)}</td><td class="right">${fmtPctDirect(100 * p.qtd_bump_segunda_cadeira / p.qtd_ingresso)}</td></tr>
          <tr><td>Os Pilares</td><td class="right">${fmtNum(p.qtd_bump_pilares)}</td><td class="right">${fmtPctDirect(100 * p.qtd_bump_pilares / p.qtd_ingresso)}</td></tr>
        </tbody>
      </table></div>
    </div></section>`;

  const diaRows = dias.map((d) => `<tr>
      <td>${fmtDate(d.dia)}</td>
      <td class="right">${fmtMoney(d.investimento_bruto)}</td>
      <td class="right">${fmtNum(d.vendas_ingresso)}</td>
      <td class="right">${fmtMoney(d.receita_total)}</td>
      <td class="right ${posNegTxt(d.exposicao)}">${fmtMoney(d.exposicao)}</td>
      <td class="right">${fmtNum(d.impressions)}</td>
      <td class="right">${fmtNum(d.clicks)}</td>
      <td class="right">${fmtNum(d.checkouts)}</td>
    </tr>`).join('');

  const desempenhoDia = `
    <section class="bg"><div class="container">
      <div class="section-title">📅 Desempenho Dia a Dia</div>
      <div class="table-wrap"><table>
        <thead><tr>
          <th>Dia</th><th class="right">Investimento</th><th class="right">Vendas</th><th class="right">Receita</th>
          <th class="right">Exposição</th><th class="right">Impressões</th><th class="right">Cliques</th><th class="right">Checkouts</th>
        </tr></thead>
        <tbody>${diaRows || '<tr><td colspan="8" class="muted">Sem dados.</td></tr>'}</tbody>
      </table></div>
    </div></section>`;

  document.getElementById('app').innerHTML = visaoGeral + funil + formasPagamento + vendasPorProduto + desempenhoDia;
}

async function init() {
  const [dias, pagamento, produto, campanhas] = await Promise.all([
    fetchView('ifb_v_daily_summary'),
    fetchView('ifb_v_pagamento_diario'),
    fetchView('ifb_v_produto_diario'),
    fetchView('ifb_v_trafego_diario_por_campanha'),
  ]);
  DADOS = { dias, pagamento, produto, campanhas };
  renderFiltro();
  renderTudo();
}

init().catch((err) => {
  document.getElementById('app').innerHTML = `<div class="state error">Erro ao carregar dados: ${err.message}</div>`;
  console.error(err);
});
</script>

</body>
</html>
