<style>

button:focus-visible{outline:3px solid var(--roxo-light);outline-offset:2px}

#pop.v{display:block}#pop h3{margin:0 0 4px;font-size:16px;font-weight:700;padding-right:26px}#pop p{margin:0 0 10px;color:var(--cinza);line-height:1.45}#pop h4{margin:12px 0 5px;font-size:13px;font-weight:600;color:var(--roxo-dark)}

.br{display:grid;grid-template-columns:104px minmax(0,1fr) 78px;gap:9px;align-items:center;padding:2.5px 0}.br span{color:var(--cinza);font-size:12.5px}.br u{display:block;height:13px;border-radius:0 4px 4px 0;background:#CFC8DA;min-width:2px}.br.at u{background:var(--roxo)}.br b{text-align:right;font-weight:600}.br.at span{color:var(--ink);font-weight:500}
#pop table{width:100%;border-collapse:collapse;font-size:12.5px}#pop th{font-weight:500;color:var(--cinza);text-align:right;padding:3px 5px;border-bottom:1px solid var(--linha);line-height:1.25}#pop td{text-align:right;padding:4px 5px;border-bottom:1px solid #F3F0F7;white-space:nowrap}#pop th:first-child,#pop td:first-child{text-align:left;padding-left:0}#pop td:first-child{white-space:normal}#pop tr.t td{font-weight:600;border-bottom:0}

footer{max-width:1240px;margin:0 auto;padding:0 24px 26px;font-size:12.5px;color:var(--cinza)}footer a{color:var(--roxo-dark);font-weight:500}

#pop{position:fixed;left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;border-radius:18px 18px 0 0;max-height:74vh;overflow:auto}#pop .x{display:block}}

<svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" aria-label="BM Mídias"><polygon points="50,4 90,27 90,73 50,96 10,73 10,27"/><polygon points="50,33 65,59 35,59"/><line x1="50" y1="4" x2="50" y2="33"/><line x1="90" y1="73" x2="65" y2="59"/><line x1="10" y1="73" x2="35" y2="59"/><line x1="90" y1="27" x2="50" y2="33"/><line x1="90" y1="27" x2="65" y2="59"/><line x1="50" y1="96" x2="65" y2="59"/><line x1="50" y1="96" x2="35" y2="59"/><line x1="10" y1="27" x2="35" y2="59"/><line x1="10" y1="27" x2="50" y2="33"/></svg>

<script>
var F=/*DADOS*/;
var P,$=function(s){return document.querySelector(s)};
function n0(v){return Math.round(v).toLocaleString('pt-BR')}
function nd(v,d){return v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function rs(v){return v==null||!isFinite(v)?'–':'R$ '+nd(v,2)}
function rs0(v){return 'R$ '+n0(v)}
function pc(v,d){return v==null||!isFinite(v)?'–':nd(v*100,d==null?1:d)+'%'}
function dv(a,b){return b?a/b:null}
var ORG={ig_unnichat:'Instagram (ESPIAR)',bio:'Link da bio',email:'E-mail',whatsapp:'WhatsApp',org_outros:'Outros'};
// ---- comparação
function dl(c,p,o){o=o||{};if(p==null||c==null||!isFinite(c)||!isFinite(p)||!p)return'';
 if(o.pp){var d=(c-p)*100;var k=Math.abs(d)<0.5?'n':(d>0?'ok':'ruim');return '<span class="dl '+k+'">'+(d>=0?'+':'−')+nd(Math.abs(d),1)+' p.p.<small>antes '+pc(p)+'</small></span>'}
 var q=c/p-1,b=o.inv?-q:q,k2=o.neutro||Math.abs(q)<0.02?'n':(b>0?'ok':'ruim');
 return '<span class="dl '+k2+'">'+(q>=0?'▲ ':'▼ ')+n0(Math.abs(q*100))+'%<small>'+(o.txt||('antes '+(o.f||n0)(p)))+'</small></span>'}
function vol(m,k){return P.porDia?m[k]/m.dias:m[k]}
function dvol(k,o){var a=vol(P.cur,k),b=vol(P.prev,k);o=o||{};if(P.porDia)o.txt=(o.f||n0)(a)+' por dia, antes '+(o.f||n0)(b).replace('R$ ','');return dl(a,b,o)}
// grupo: compara por dia, sem os dias em que o link do grupo falhou
function gd(m,k){return m.v.dias?m.v[k]/m.v.dias:null}
function dgrp(k,nt){var falha=P.cur.v.dias<P.cur.dias||P.prev.v.dias<P.prev.dias;if(!falha&&!P.porDia)return dl(P.cur[k],P.prev[k],{neutro:nt});
 return dl(gd(P.cur,k),gd(P.prev,k),{neutro:nt,txt:nd(gd(P.cur,k),0)+' por dia, antes '+nd(gd(P.prev,k),0)+(falha?'*':'')})}
function txg(m,t){return dv(m.v['grp'+t],m.v['cad'+t])}
function cpe(m){return dv(m.v.inv,m.v.grpP)}
// ---- blocos do pop
function bars(tit,rows){var mx=Math.max.apply(null,rows.map(function(r){return r[1]||0}))||1;
 return (tit?'<h4>'+tit+'</h4>':'')+rows.map(function(r){return '<div class="br'+(r[3]?' at':'')+'"><span>'+r[0]+'</span><u style="width:'+Math.max(2,(r[1]||0)/mx*100)+'%"></u><b>'+r[2]+'</b></div>'}).join('')}
function tend(tit,f,fm){if(!P.trend.length){var a=f(P.prev),b=f(P.cur);return bars(tit,[[P.prevL,a,fm(a)],[P.curL,b,fm(b),1]])}
 return bars(tit,P.trend.map(function(t,i){var v=f(t.m);return [t.l,v,fm(v),i===P.trend.length-1]}))}
function tab(h,rows,tot){return '<table><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join('')+'</tr>'+rows.map(function(r,i){return '<tr'+(tot&&i===rows.length-1?' class="t"':'')+'>'+r.map(function(x){return '<td>'+x+'</td>'}).join('')+'</tr>'}).join('')+'</table>'}
function cods(m){return Object.keys(m.camp).filter(function(c){return c!=='SN'&&m.camp[c].inv>1}).sort(function(a,b){return m.camp[b].inv-m.camp[a].inv})}
function pags(){return ['A','B','C'].filter(function(p){return P.cur.pags[p]||P.prev.pags[p]})}
function g(m,p,k){return m.pags[p]?m.pags[p][k]:0}
function nomeCri(n){return n.replace(/_SST_CAP_/,' ').replace(/_SST_CARROSSEL_CAP_/,' ').replace(/[_.]\d+[.]\d+$/,'').replace(/\.0$/,'').replace(/_\d\d\.\d\d\.\d\d$/,'')}
function vs(){return P.porDia?' por dia':''}
var falhaTxt='* Em 15 e 16/11 o link do grupo falhou e poucas entradas foram registradas. Taxa, custo e comparação de entradas deixam esses dois dias fora.';
function temFalha(){return P.cur.v.dias<P.cur.dias||P.prev.v.dias<P.prev.dias}
var POP={
 inv:function(){var im=1+F.imposto,c=F.mes.inv*im,r=F.teto-c;var rows=cods(P.cur).map(function(k){var x=P.cur.camp[k];return ['['+k+']&nbsp;página&nbsp;'+(/PAGINA ([ABC])/.exec(P.cur.nomes[k])||['','?'])[1],rs0(x.inv),x.cad,rs(dv(x.inv,x.cad)),rs(dv(x.inv,x.grp))]});
  rows.push(['Total',rs0(P.cur.inv),P.cur.cadP,rs(dv(P.cur.inv,P.cur.cadP)),rs(dv(P.cur.inv,P.cur.grpP))]);
  return ['Investimento','Gasto no Meta, sem imposto. Com o imposto de 13,83%: <b>'+rs0(P.cur.inv*im)+'</b>.',tab(['Campanha','Investido','Cadastros','Custo por cadastro','Custo por entrada'],rows,1)+'<p class="nt">Novembro até '+F.corte+': <b>'+rs0(c)+'</b> com imposto, do teto de '+rs0(F.teto)+'. Restam '+rs0(r)+', ou '+rs0(r/F.mes.diasRest/im)+' por dia no gerenciador até 30/11.</p>']},
 impr:function(){return ['Impressões','Quantas vezes os anúncios apareceram. O CPM é o preço de mil impressões.',tend('CPM (R$ por mil impressões)',function(m){return dv(m.inv,m.impr)*1000},rs)]},
 ctr:function(){return ['Taxa de clique (CTR)','De cada 100 vezes que o anúncio aparece, quantas viram clique no link.',tend('CTR',function(m){return dv(m.clk,m.impr)},function(v){return pc(v,2)})]},
 clk:function(){return ['Cliques no link','Pessoas que clicaram para ir à página.',tend('Custo por clique',function(m){return dv(m.inv,m.clk)},rs)+'<h4>Criativos que mais gastaram</h4>'+tab(['Criativo','Investido','Cliques','CTR'],P.cur.cri.slice(0,5).map(function(c){return [nomeCri(c.n),rs0(c.inv),c.clk,pc(dv(c.clk,c.impr),2)]}))]},
 con:function(){return ['Carregamento da página','De cada 100 cliques, quantos esperaram a página abrir. Quando cai, vale checar a velocidade da página.',tend('Cliques que abriram a página',function(m){return dv(m.lpv,m.clk)},pc)]},
 lpv:function(){return ['Visualizações da página','Pessoas que abriram uma das três páginas de captura.','<h4>Por página</h4>'+tab(['Página','Agora','Antes'],pags().map(function(p){return ['Página&nbsp;'+p,n0(g(P.cur,p,'lpv')),n0(g(P.prev,p,'lpv'))]}).concat([['Total',n0(P.cur.lpv),n0(P.prev.lpv)]]),1)+tend('Custo por visualização',function(m){return dv(m.inv,m.lpv)},rs)]},
 conv:function(){return ['Conversão da página','De cada 100 pessoas que abrem a página, quantas se cadastram.',bars('Por página, '+P.curL,pags().map(function(p){var v=dv(g(P.cur,p,'leads'),g(P.cur,p,'lpv'));return ['Página&nbsp;'+p,v,pc(v),1]}))+'<h4>Comparação</h4>'+tab(['',P.prevL,P.curL,'Visualizações','Leads','Custo por cadastro'],pags().map(function(p){var x=P.cur.pags[p]||{};return ['Página&nbsp;'+p,pc(dv(g(P.prev,p,'leads'),g(P.prev,p,'lpv'))),'<b>'+pc(dv(x.leads,x.lpv))+'</b>',n0(x.lpv||0),n0(x.leads||0),rs(dv(x.inv,x.cad))]}).concat([['Geral',pc(dv(P.prev.leads,P.prev.lpv)),pc(dv(P.cur.leads,P.cur.lpv)),n0(P.cur.lpv),n0(P.cur.leads),rs(dv(P.cur.inv,P.cur.cadP))]]),1)+tend('Conversão geral',function(m){return dv(m.leads,m.lpv)},pc)+'<p class="nt">Leads e visualizações contados pelo Meta. As páginas rodam em campanhas e públicos diferentes, então a diferença entre elas não é um teste controlado.</p>']},
 cadP:function(){var h=tend('Custo por cadastro',function(m){return dv(m.inv,m.cadP)},rs);
  h+='<h4>Criativos (custo por lead no Meta)</h4>'+tab(['Criativo','Investido','Leads','Custo'],P.cur.cri.slice(0,6).map(function(c){return [nomeCri(c.n),rs0(c.inv),c.leads,rs(dv(c.inv,c.leads))]}));
  return ['Cadastros do tráfego pago','Pessoas únicas que se cadastraram pelo anúncio, sem repetição. O Meta contou '+n0(P.cur.leads)+' leads no período.',h]},
 perf:function(){var a=P.cur.aud,b=P.prev.aud;function l(o,k){return o&&o[k]?o[k]:{n:0,m:0,h:0,v55:0}}var ks=Object.keys(a).filter(function(k){return k!=='T'}).sort();
