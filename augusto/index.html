<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Para o Augusto — Antes de Você Nascer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF6EF; --cream-2:#F3EDE1; --ink:#2B2620; --soft:#7A7166;
    --gold:#B08A3E; --gold-soft:#D6B97E; --line:#E5DCCB;
    --antes:#8C7B6B; --depois:#5B7A5E;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--gold);color:#fff}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px}
  .serif{font-family:'Fraunces',serif}

  /* HERO */
  .hero{text-align:center;padding:110px 24px 80px;position:relative;
    background:radial-gradient(ellipse 70% 55% at 50% -10%, rgba(176,138,62,.14), transparent), var(--cream)}
  .hero .kicker{font-size:12px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:26px}
  .hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(44px,9vw,84px);line-height:1.05;letter-spacing:-.01em}
  .hero h1 em{font-style:italic;font-weight:300;color:var(--gold)}
  .hero .intro{max-width:560px;margin:34px auto 0;font-family:'Fraunces',serif;font-size:clamp(17px,2.6vw,21px);font-weight:300;font-style:italic;color:var(--soft);line-height:1.75}
  .hero .orn{margin-top:44px;color:var(--gold);letter-spacing:.9em;padding-left:.9em;opacity:.7}

  /* GRID DE PESSOAS */
  .pessoas{padding:60px 0 100px}
  .p-count{text-align:center;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-bottom:40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center;cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;text-decoration:none;color:var(--ink);display:block}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(43,38,32,.10)}
  .avatar{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:#fff;
    background:linear-gradient(135deg,var(--gold),#8a6a2c);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .card .nm{font-family:'Fraunces',serif;font-weight:600;font-size:18px;line-height:1.3}
  .card .ler{margin-top:10px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .card .tag-ex{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.14em;background:var(--cream-2);color:var(--soft);
    border-radius:100px;padding:3px 10px;text-transform:uppercase}

  /* PÁGINA DA PESSOA */
  .pagina{display:none;padding:70px 0 100px}
  .voltar{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);text-decoration:none;margin-bottom:44px;cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif}
  .voltar:hover{text-decoration:underline}
  .p-head{text-align:center;margin-bottom:48px}
  .p-head .avatar{width:110px;height:110px;font-size:38px;margin-bottom:22px}
  .p-head h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,5vw,44px)}
  .p-head .sub{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);margin-top:8px}

  .carta{background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 46px;margin-bottom:52px;position:relative;text-align:center}
  .carta::before{content:"❝";font-family:'Fraunces',serif;font-size:64px;color:var(--gold-soft);line-height:0;display:block;margin-bottom:26px}
  .carta p{font-family:'Fraunces',serif;font-size:clamp(19px,3vw,24px);font-weight:300;font-style:italic;line-height:1.75;color:var(--ink)}
  .carta .de{margin-top:22px;font-family:'Inter',sans-serif;font-style:normal;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}

  .ad-title{text-align:center;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--soft);margin-bottom:30px}
  .ad-title b{color:var(--ink);font-weight:600}
  .antesdepois{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:52px}
  @media(max-width:640px){.antesdepois{grid-template-columns:1fr}}
  .col{border-radius:18px;padding:34px 32px;background:#fff;border:1px solid var(--line)}
  .col .c-label{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;margin-bottom:18px;display:flex;align-items:center;gap:10px}
  .col.antes .c-label{color:var(--antes)}
  .col.depois .c-label{color:var(--depois)}
  .col .c-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .col ul{list-style:none}
  .col li{padding:9px 0 9px 24px;position:relative;font-size:15px;color:var(--ink);border-bottom:1px dashed var(--line)}
  .col li:last-child{border-bottom:none}
  .col.antes li::before{content:"–";position:absolute;left:2px;color:var(--antes);font-weight:600}
  .col.depois li::before{content:"✦";position:absolute;left:0;color:var(--depois);font-size:12px;top:14px}
  .col.depois{background:linear-gradient(160deg,#F6FAF4,#fff)}

  .fotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .foto{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--cream-2)}
  .foto img{width:100%;height:240px;object-fit:cover;display:block}
  .foto .leg{padding:10px 14px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);text-align:center}
  .foto.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:240px;color:var(--soft);font-size:12px;letter-spacing:.1em}
  .foto.ph span{font-size:34px;margin-bottom:10px;opacity:.5}

  footer{border-top:1px solid var(--line);padding:56px 24px;text-align:center}
  footer .f1{font-family:'Fraunces',serif;font-style:italic;font-size:17px;color:var(--soft)}
  footer .f2{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-top:14px}
</style>
</head>
<body>

<!-- HOME -->
<div id="home">
  <div class="hero">
    <div class="kicker">Antes de você nascer</div>
    <h1 class="serif">Para o <em>Augusto</em></h1>
    <p class="intro">Augusto, antes de você chegar ao mundo, o seu pai e a sua mãe já tinham mudado milhares de vidas.<br>Estas são algumas delas — contadas por quem viveu.</p>
    <div class="orn">✦ ✦ ✦</div>
  </div>
  <div class="pessoas wrap">
    <div class="p-count" id="contador"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- PÁGINA INDIVIDUAL -->
<div id="pagina" class="pagina">
  <div class="wrap">
    <button class="voltar" onclick="location.hash=''">← Todas as histórias</button>
    <div id="p-conteudo"></div>
  </div>
</div>

<footer>
  <div class="f1">«Você nasceu filho de duas pessoas que transformam vidas.»</div>
  <div class="f2">Com amor, os mentorados — 2026</div>
</footer>

<script>
/* ============================================================
   DADOS DOS MENTORADOS
   Cada entrada: slug (URL), nome, carta (até ~300 caracteres),
   antes[], depois[], fotos[{src, legenda}] (opcional, use [] sem fotos)
   Os 3 abaixo são EXEMPLOS para validação do formato — substituir
   pelo material real da pasta do Drive.
   ============================================================ */
const MENTORADOS = [
  {
    slug: "exemplo-maria",
    nome: "Maria Silva",
    exemplo: true,
    carta: "Augusto, seu pai e sua mãe entraram na minha vida em 2022 e nada mais foi igual. Você nasceu filho de duas pessoas que transformam vidas — a minha foi uma delas. Você vai crescer vendo de perto o que eu tive a sorte de conhecer.",
    antes: [
      "CLT, sem perspectiva de crescimento",
      "Morava de aluguel com os pais",
      "Nunca tinha viajado de avião",
      "Sonhos guardados na gaveta"
    ],
    depois: [
      "Gestora de tráfego com 12 clientes fixos",
      "Apartamento próprio quitado",
      "Primeira viagem internacional com a família",
      "Virou referência na própria cidade"
    ],
    fotos: []
  },
  {
    slug: "exemplo-joao",
    nome: "João Santos",
    exemplo: true,
    carta: "Augusto, quando você ler isso, saiba: teu pai me ensinou que trabalho sério muda destino de família inteira. E tua mãe segurou os bastidores pra isso chegar em gente como eu. Devo muito aos dois.",
    antes: [
      "Endividado, negativado",
      "Trabalhava 12h por dia sem resultado"
    ],
    depois: [
      "Empresa própria com 3 funcionários",
      "Dívidas quitadas, nome limpo",
      "Tempo pra almoçar com os filhos todo dia"
    ],
    fotos: []
  },
  {
    slug: "exemplo-ana",
    nome: "Ana Oliveira",
    exemplo: true,
    carta: "Augusto, eu quase desisti de tudo em 2023. Foi uma frase do seu pai numa mentoria que me fez continuar. Hoje minha filha estuda na escola que eu sonhei. Seus pais fazem isso: plantam futuro na vida dos outros.",
    antes: [
      "Quase desistindo do digital",
      "Renda instável, ansiedade alta"
    ],
    depois: [
      "Faturamento recorde 6 meses seguidos",
      "Filha na escola dos sonhos",
      "Paz pra dormir tranquila"
    ],
    fotos: []
  }
];

/* ---------- render ---------- */
const grid = document.getElementById('grid');
const contador = document.getElementById('contador');
const home = document.getElementById('home');
const pagina = document.getElementById('pagina');
const pConteudo = document.getElementById('p-conteudo');

function iniciais(nome){
  return nome.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
}
function avatarHTML(m, extra=''){
  if(m.foto_perfil) return `<div class="avatar ${extra}"><img src="${m.foto_perfil}" alt="${m.nome}"></div>`;
  return `<div class="avatar ${extra}">${iniciais(m.nome)}</div>`;
}

function renderHome(){
  contador.textContent = MENTORADOS.length + (MENTORADOS.length===1?' história':' histórias') + ' de vidas transformadas';
  grid.innerHTML = MENTORADOS.map(m=>`
    <a class="card" href="#/${m.slug}">
      ${avatarHTML(m)}
      <div class="nm">${m.nome}</div>
      <div class="ler">Ler história →</div>
      ${m.exemplo?'<div class="tag-ex">exemplo — substituir</div>':''}
    </a>`).join('');
}

function renderPessoa(m){
  const fotosHTML = (m.fotos && m.fotos.length)
    ? `<div class="ad-title" style="margin-top:52px">Momentos</div>
       <div class="fotos">${m.fotos.map(f=>`
         <div class="foto"><img src="${f.src}" alt="${f.legenda||m.nome}">${f.legenda?`<div class="leg">${f.legenda}</div>`:''}</div>`).join('')}
       </div>`
    : '';
  pConteudo.innerHTML = `
    <div class="p-head">
      ${avatarHTML(m)}
      <h2>${m.nome}</h2>
      <div class="sub">Para o Augusto</div>
    </div>
    <div class="carta">
      <p>${m.carta}</p>
      <div class="de">— ${m.nome}</div>
    </div>
    <div class="ad-title">O meu <b>antes e depois</b> dos seus pais entrarem na minha vida</div>
    <div class="antesdepois">
      <div class="col antes">
        <div class="c-label">Antes</div>
        <ul>${m.antes.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>
      <div class="col depois">
        <div class="c-label">Depois</div>
        <ul>${m.depois.map(i=>`<li>${i}</li>`).join('')}</ul>
      </div>
    </div>
    ${fotosHTML}`;
}

function rota(){
  const hash = location.hash.replace(/^#\/?/, '');
  const m = MENTORADOS.find(x=>x.slug===hash);
  if(m){
    home.style.display='none';
    pagina.style.display='block';
    renderPessoa(m);
    window.scrollTo(0,0);
  } else {
    pagina.style.display='none';
    home.style.display='block';
  }
}
window.addEventListener('hashchange', rota);
renderHome();
rota();
</script>
</body>
</html>
